services:
  - type: web
    name: timviec-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timviec-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  # ponytail: free Postgres bị Render xóa sau 90 ngày — ~tuần 13 kể từ lúc tạo.
  # Sát mốc nộp báo cáo tuần 12. Theo dõi ngày tạo, nâng lên plan trả phí ($7/mo)
  # trước khi hết hạn nếu cần production sống qua tuần 12.
  - name: timviec-db
    plan: free
    postgresMajorVersion: 16
