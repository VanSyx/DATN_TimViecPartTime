# Tên project cố định: thư mục này trùng basename với D:\DATN_JobPartTime\DATN_TimViecPartTime,
# nếu không khóa tên thì compose sẽ coi hai bản là cùng project và ghi đè container của nhau.
name: timviec

services:
  db:
    # ponytail: postgis image only; add pgvector (custom Dockerfile FROM postgis) at week 6 when embedding lands
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timviec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/timviec
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
