services:
  - type: web
    name: timviec-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Neon free (Postgres 16 + PostGIS, AWS us-west-2), không hết hạn như Postgres free của Render (30 ngày).
      # Dùng chuỗi kết nối direct (không -pooler), có ?sslmode=require. Đặt tay trên dashboard.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # FR8: API key Brevo + địa chỉ người gửi đã xác minh trên Brevo. Thiếu key → mã chỉ ghi log
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

  # Backend gọi qua URL public (AI_SERVICE_URL=https://timviec-ai.onrender.com): service free
  # không nhận được request qua private network của Render. Không cần secret/biến môi trường.
  - type: web
    name: timviec-ai
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    healthCheckPath: /health
