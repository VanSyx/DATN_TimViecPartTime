# Tên project cố định: thư mục này trùng basename với D:\DATN_JobPartTime\DATN_TimViecPartTime,
# nếu không khóa tên thì compose sẽ coi hai bản là cùng project và ghi đè container của nhau.
name: timviec

services:
  db:
    # ponytail: postgis image only; add pgvector (custom Dockerfile FROM postgis) at week 6 when embedding lands
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timviec
    ports:
      # 5433 ở host vì máy dev đã có PostgreSQL cài sẵn chiếm 5432 — nối từ host dùng 5433,
      # các service trong compose vẫn nối qua db:5432 như bình thường.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/timviec
      # HS256 cần khóa >= 32 byte, PyJWT cảnh báo nếu ngắn hơn
      JWT_SECRET: dev-only-not-a-real-secret-min-32-bytes
      JWT_REFRESH_SECRET: dev-only-not-a-real-refresh-secret-min-32-bytes
      CORS_ORIGINS: http://localhost:5173
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  ai-service:
    build: ./ai-service
    ports:
      - "8001:8001"
    volumes:
      - ./ai-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

volumes:
  pgdata:
